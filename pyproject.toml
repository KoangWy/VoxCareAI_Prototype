[project]
name = "voxcare-ai-prototype"
version = "0.1.0"
description = "English browser voice customer-support prototype for the fictional retailer VoxCom: streaming ASR, judged end-of-turn control, grounded read-only tools, streaming TTS."
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = ["voice-assistant", "customer-support", "turn-taking", "fastapi", "websocket", "asr", "tts", "llm"]
dependencies = [
  "anthropic>=0.49,<1",
  "chromadb>=1.0,<2",
  "fakeredis>=2.26,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.75,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pyjwt>=2.9,<3",
  "python-dotenv>=1,<2",
  "redis>=5.2,<8",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.urls]
Repository = "https://github.com/KoangWy/VoxCareAI_Prototype"

[dependency-groups]
demo = [
    "piper-tts>=1.8",
    "vosk==0.3.44",
]
# Embedded PostgreSQL for machines without Docker or a native install (wheels for CPython 3.9-3.12).
localdb = ["pgserver>=0.1.4; python_version < '3.13'"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
# `uv run` / `uv sync` install the embedded PostgreSQL too, so the app starts without Docker on Python 3.12.
default-groups = ["dev", "localdb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
"scripts/*.py" = ["S101"]
"scripts/live_mercury_check.py" = ["E402"]
