[project]
name = "voxcare-ai-prototype"
version = "0.1.0"
description = "English browser voice customer-support prototype for the fictional retailer VoxCom: streaming ASR, judged end-of-turn control, grounded read-only tools, streaming TTS."
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = ["voice-assistant", "customer-support", "turn-taking", "fastapi", "websocket", "asr", "tts", "llm"]
dependencies = [
  "anthropic>=0.49,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.75,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.urls]
Repository = "https://github.com/KoangWy/VoxCareAI_Prototype"

[dependency-groups]
demo = [
    "piper-tts>=1.8",
    "vosk==0.3.44",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/*.py" = ["S101"]
"scripts/live_mercury_check.py" = ["E402"]
